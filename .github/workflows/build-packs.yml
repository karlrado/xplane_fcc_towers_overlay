name: build-pack

on:
  workflow_dispatch:
  # Weekly rebuild: the FCC antenna database refreshes about once a week.
  # Monday 16:00 UTC (~10:00 Denver) so the week's refresh is likely in.
  schedule:
    - cron: '0 16 * * 1'
    # One-off: run 2026-10-07 16:00 UTC (10:00 Denver). GHA cron is
    # recurring-only, so this also fires every later Oct 7; remove after use.
    - cron: '0 16 7 10 *'
  push:
    branches: [main]
    tags: ["v*", "weekly-*"]

concurrency:
  group: build-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DSFTool build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ zlib1g-dev

      - name: Obtain DSFTool (vendored build, prebuilt fallback)
        run: |
          if sh tools/dsftool/build.sh; then
            echo "Built DSFTool from vendored source"
          else
            echo "Source build failed; falling back to official prebuilt binary"
            sh tools/dsftool/fetch_prebuilt.sh
          fi

      - name: Verify DSFTool
        run: ./tools/dsftool/DSFTool --version

      - name: Install test dependencies
        run: python -m pip install pytest

      # tools/dsftool on PATH so the DSFTool round-trip test (and any full
      # build inside the suite) finds the same binary the release build uses.
      - name: Run test suite
        run: PATH="$PWD/tools/dsftool:$PATH" python -m pytest -q

  build:
    name: Build scenery pack
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DSFTool build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ zlib1g-dev

      - name: Obtain DSFTool (vendored build, prebuilt fallback)
        run: |
          if sh tools/dsftool/build.sh; then
            echo "Built DSFTool from vendored source"
          else
            echo "Source build failed; falling back to official prebuilt binary"
            sh tools/dsftool/fetch_prebuilt.sh
          fi

      - name: Verify DSFTool
        run: ./tools/dsftool/DSFTool --version

      - name: Build FCC_Towers pack (fresh FCC data)
        run: |
          # Record the release identity in the pack's BUILD_INFO.txt.
          # Tag-triggered runs use their tag; schedule/dispatch runs will
          # be released as weekly-<UTC date> (same computation as the
          # release job); plain main pushes are not released.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="weekly-$(date -u +%F)"
          else
            tag="CI build (not released)"
          fi
          python fcc_towers.py build --dsftool tools/dsftool/DSFTool \
            --release-tag "$tag"

      # The showroom pack is intentionally NOT built here: it is a developer
      # convenience, not something most users want.  DIY: clone the repo and
      # run `python fcc_towers.py showroom` (see README).

      - name: Zip the pack
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          (cd output && zip -qr "../FCC_Towers-$version.zip" FCC_Towers)
          ls -l *.zip

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcc-towers-pack
          path: FCC_Towers-*.zip

  release:
    name: Create release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/weekly-') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (gh release create needs the tag locally)
        uses: actions/checkout@v4

      # Schedule/dispatch runs are not triggered by a tag, so create and push
      # the dated tag here. Tag-triggered runs skip this and use their own tag.
      - name: Create dated release tag (schedule/dispatch runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          tag="weekly-$(date -u +%F)"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "::error::Release tag $tag already exists; push a differently-dated weekly-<date> tag instead"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Weekly rebuild from current FCC data"
          git push origin "refs/tags/$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download pack artifact
        uses: actions/download-artifact@v4
        with:
          name: fcc-towers-pack
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag for this release: the one created above (schedule/dispatch)
          # or the tag that triggered the run.
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          # Version tags are milestone pre-releases; weekly data refreshes
          # are normal releases and become GitHub's "Latest".
          prerelease=""
          if [[ "$tag" == v* ]]; then prerelease=--prerelease; fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            $prerelease \
            dist/*.zip
