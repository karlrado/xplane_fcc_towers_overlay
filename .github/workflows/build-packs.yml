name: build-pack

on:
  workflow_dispatch:
  # Weekly rebuild: the FCC antenna database refreshes about once a week
  # at approximately 5:00 AM ET on Sundays.
  # This workflow runs on Monday at 10:00 AM UTC to give the refresh
  # time to complete and at a time when the runners may be less busy.
  schedule:
    - cron: '0 10 * * 1'
  push:
    branches: [main]
    tags: ["v*", "weekly-*"]

concurrency:
  group: build-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DSFTool build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ zlib1g-dev

      - name: Obtain DSFTool (vendored build, prebuilt fallback)
        run: |
          if sh tools/dsftool/build.sh; then
            echo "Built DSFTool from vendored source"
          else
            echo "Source build failed; falling back to official prebuilt binary"
            sh tools/dsftool/fetch_prebuilt.sh
          fi

      - name: Verify DSFTool
        run: ./tools/dsftool/DSFTool --version

      - name: Install test dependencies
        run: python -m pip install pytest

      # tools/dsftool on PATH so the DSFTool round-trip test (and any full
      # build inside the suite) finds the same binary the release build uses.
      - name: Run test suite
        run: PATH="$PWD/tools/dsftool:$PATH" python -m pytest -q

  build:
    name: Build scenery pack
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DSFTool build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ zlib1g-dev

      - name: Obtain DSFTool (vendored build, prebuilt fallback)
        run: |
          if sh tools/dsftool/build.sh; then
            echo "Built DSFTool from vendored source"
          else
            echo "Source build failed; falling back to official prebuilt binary"
            sh tools/dsftool/fetch_prebuilt.sh
          fi

      - name: Verify DSFTool
        run: ./tools/dsftool/DSFTool --version

      - name: Build FCC_Towers pack (fresh FCC data)
        run: |
          # Record the release identity in the pack's BUILD_INFO.txt.
          # Tag-triggered runs use their tag; schedule/dispatch runs will
          # be released as weekly-<UTC date> (same computation as the
          # release job); plain main pushes are not released.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="weekly-$(date -u +%F)"
          else
            tag="CI build (not released)"
          fi
          python fcc_towers.py build --dsftool tools/dsftool/DSFTool \
            --release-tag "$tag"

      # The showroom pack is intentionally NOT built here: it is a developer
      # convenience, not something most users want.  DIY: clone the repo and
      # run `python fcc_towers.py showroom` (see README).

      # Week-over-week FCC change report: compare this run's manifest against
      # the most recently released pack's manifest.  Released runs only (same
      # gating as the release job).  Best-effort: any failure is logged but
      # never fails the (already-built) pack.  The report is appended to
      # BUILD_INFO.txt next and ships inside the release zip.
      - name: Week-over-week FCC change report
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/tags/weekly-') ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          CUR="output/FCC_Towers/antenna_manifest.csv"
          REPORT="w2w_report.txt"
          if [ ! -f "$CUR" ]; then
            printf '## Week-over-week FCC changes\n  (current run produced no manifest; nothing to compare)\n' > "$REPORT"
            echo "::warning::No antenna_manifest.csv produced by the build"
          else
            prior="$(gh release list --limit 25 --json name,isPrerelease,publishedAt \
              | jq -r '[.[] | select(.isPrerelease | not)] | max_by(.publishedAt) | .name' 2>/dev/null)"
            if [ -z "$prior" ]; then
              printf '## Week-over-week FCC changes\n  (no prior release to compare against)\n' > "$REPORT"
            else
              pm="prior_manifest.csv"
              ok=""
              if gh release download "$prior" --pattern 'FCC_Towers-*.zip' --dir "prior" >/dev/null 2>&1; then
                z="$(ls prior/FCC_Towers-*.zip 2>/dev/null | head -1)"
                if [ -n "$z" ] && unzip -o -p "$z" FCC_Towers/antenna_manifest.csv > "$pm" 2>/dev/null && [ -s "$pm" ]; then
                  ok="yes"
                fi
              fi
              if [ "$ok" = "yes" ]; then
                python fcc_towers.py diff --current "$CUR" --previous "$pm" --label "$prior" --out "$REPORT"
              else
                printf '## Week-over-week FCC changes (vs %s)\n  (prior release has no usable antenna_manifest.csv)\n' "$prior" > "$REPORT"
              fi
            fi
          fi
          echo "----- week-over-week report -----"
          cat "$REPORT"
          echo "----------------------------------"

      - name: Append week-over-week report to BUILD_INFO.txt
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/tags/weekly-') ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        run: |
          if [ -f "w2w_report.txt" ]; then
            printf '\n\n' >> "output/FCC_Towers/BUILD_INFO.txt"
            cat "w2w_report.txt" >> "output/FCC_Towers/BUILD_INFO.txt"
            echo "Appended week-over-week report to BUILD_INFO.txt"
          else
            echo "::warning::w2w_report.txt not found; skipping append"
          fi

      - name: Zip the pack
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          (cd output && zip -qr "../FCC_Towers-$version.zip" FCC_Towers)
          ls -l *.zip

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcc-towers-pack
          path: FCC_Towers-*.zip

  release:
    name: Create release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/weekly-') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (gh release create needs the tag locally)
        uses: actions/checkout@v4

      # Schedule/dispatch runs are not triggered by a tag, so create and push
      # the dated tag here. Tag-triggered runs skip this and use their own tag.
      - name: Create dated release tag (schedule/dispatch runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          tag="weekly-$(date -u +%F)"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "::error::Release tag $tag already exists; push a differently-dated weekly-<date> tag instead"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Weekly rebuild from current FCC data"
          git push origin "refs/tags/$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download pack artifact
        uses: actions/download-artifact@v4
        with:
          name: fcc-towers-pack
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag for this release: the one created above (schedule/dispatch)
          # or the tag that triggered the run.
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          # All releases are normal (stable); there is no pre-release
          # channel. If one is ever needed, set the flag afterwards via
          # the web UI: gh release edit <tag> --prerelease
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            dist/*.zip

      # Keep the public release list bounded. Retain ALL version milestones
      # (v*) and the newest N weekly-* releases (N via the KEEP_WEEKLY repo
      # variable, default 4 ~= a month of data snapshots). Delete older weekly
      # releases and their tags. Pruning is best-effort: a failure here is
      # logged but does not fail the (already-created) release.
      - name: Prune old weekly releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=${{ vars.KEEP_WEEKLY || '4' }}
          old="$(
            gh release list --limit 500 --json name,createdAt \
              | jq -r '
                  [.[] | select(.name | startswith("weekly-"))] as $w
                  | ($w | length) as $n
                  | (if $n > '"$KEEP"' then $w | sort_by(.createdAt) | .[0:($n-"'$KEEP'")] else [] end)
                  | .[] | .name'
          )" || { echo "::warning::Could not list releases; skipping prune"; exit 0; }
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting old weekly release + tag: $tag"
            gh release delete "$tag" --yes --cleanup-on-delete \
              || echo "::warning::Failed to delete $tag; continuing"
          done <<< "$old"
          echo "Remaining releases:"
          gh release list --limit 20 || true
