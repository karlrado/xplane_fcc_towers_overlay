name: build-pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DSFTool build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ zlib1g-dev

      - name: Obtain DSFTool (vendored build, prebuilt fallback)
        run: |
          if sh tools/dsftool/build.sh; then
            echo "Built DSFTool from vendored source"
          else
            echo "Source build failed; falling back to official prebuilt binary"
            sh tools/dsftool/fetch_prebuilt.sh
          fi

      - name: Verify DSFTool
        run: ./tools/dsftool/DSFTool --version

      - name: Install test dependencies
        run: python -m pip install pytest

      # tools/dsftool on PATH so the DSFTool round-trip test (and any full
      # build inside the suite) finds the same binary the release build uses.
      - name: Run test suite
        run: PATH="$PWD/tools/dsftool:$PATH" python -m pytest -q

  build:
    name: Build scenery pack
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DSFTool build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ zlib1g-dev

      - name: Obtain DSFTool (vendored build, prebuilt fallback)
        run: |
          if sh tools/dsftool/build.sh; then
            echo "Built DSFTool from vendored source"
          else
            echo "Source build failed; falling back to official prebuilt binary"
            sh tools/dsftool/fetch_prebuilt.sh
          fi

      - name: Verify DSFTool
        run: ./tools/dsftool/DSFTool --version

      - name: Build FCC_Towers pack (fresh FCC data)
        run: python fcc_towers.py build --dsftool tools/dsftool/DSFTool

      # The showroom pack is intentionally NOT built here: it is a developer
      # convenience, not something most users want.  DIY: clone the repo and
      # run `python fcc_towers.py showroom` (see README).

      - name: Zip the pack
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          (cd output && zip -qr "../FCC_Towers-$version.zip" FCC_Towers)
          ls -l *.zip

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcc-towers-pack
          path: FCC_Towers-*.zip

  release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (gh release create needs the tag locally)
        uses: actions/checkout@v4

      - name: Download pack artifact
        uses: actions/download-artifact@v4
        with:
          name: fcc-towers-pack
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease \
            dist/*.zip
